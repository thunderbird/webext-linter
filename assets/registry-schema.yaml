# THE SHAPE OF registry.yaml, beside the file it describes.
#
# Which sections exist, which keys each accepts, what each key holds, which are required,
# and which are recognized only to be refused. Everything else is unknown, and an unknown
# key is the failure this file exists for: nothing read it, so it was dropped, and the entry
# meant something other than what it said for as long as nobody looked. A misspelt SECTION
# name is the same failure one level up - it drops that whole list from every review.
#
# This is asserted on every run, before the command line is even parsed (src/cli.js), so a
# registry that does not match its shape means the tool does not start.
#
# Each field carries its own `why`, which is the second half of every message raised from
# it: a refusal says what the key would have COST, not what type it wanted, because the
# person reading it is authoring a review rule rather than debugging a value.
#
# `kind` is one of:
#   text      a string; `allow-empty` where an empty one is an authored answer
#   one-of    a member of a closed set, named in `values` (resolved in registry-schema.js)
#   gate      true only - absence already says false, so writing it says nothing twice
#   boolean   true or false, for a key every entry answers explicitly (`required`)
#   list      a list of non-empty strings; `of: mapping` for a list of mappings whose own
#             keys another rule closes; `allow-empty` as above
#   version   a Thunderbird version bound, string or bare number
#   refused   known, and refused: the `why` says what reading it would have meant
#   entries   a list of mappings, each against `shape`
#   object    a mapping whose key set is exactly its `fields`
#   prose-map a mapping of key -> prose; `closed` refuses a key no reader looks up
#   map-of    a mapping of key -> mapping, each against `shape`
#
# Belongs here: the vocabulary, and the reason each rule exists. Does NOT belong here:
# anything that reads what the prose SAYS, anything needing more than one entry, and
# anything about a value measured against another value - those stay in the assert*
# functions in src/checks/registry.js, which run after this and keep their own messages.

# Field groups, spread into the shapes that share them by `include`.
groups:
  # What every check entry shares: the id, the name, and the band.
  identity:
    check:
      kind: text
      required: true
      why: >-
        it is the id everything else addresses the entry by - its module, its findings, its
        response and its severity all resolve through it
    title:
      kind: text
      required: true
      why: >-
        it is how the entry is named wherever it is listed, and an untitled one has no name
        for a report to print
    severity:
      kind: one-of
      values: VALID_CHECK_SEVERITIES
      required: true
      why: >-
        a check's impact is configuration, so an entry that omits it is a registry mistake
        rather than a request for the strictest value. An escalate-only check declares one
        too - it says what a finding from it would mean, should it ever gain one

  # The wording an entry may author, for either reader.
  wording:
    response:
      kind: text
      why: it is the text a report prints for a case this check found
    response-for-xpi:
      kind: text
      why: the wording an XPI review prints for this check
    response-for-sca:
      kind: text
      why: the wording a source review prints for this check
    instructions:
      kind: text
      why: the question put to either reader, agent or person
    instructions-for-human:
      kind: text
      why: the question a person is asked
    instructions-for-llm:
      kind: text
      why: the question an agent is asked
    default-note:
      kind: text
      why: >-
        the marker that stands in this check's list when the reviewer reported the case
        without writing a note

shapes:
  # A check that RUNS, so it routes and it can escalate.
  rule-entry:
    include: [identity, wording]
    input:
      kind: one-of
      values: VALID_CHECK_INPUTS
      required: true
      why: >-
        every check declares which add-on artifact it reads, because routing is total -
        there is no default artifact to fall through to. source = the review target,
        xpi = the built XPI, sca = the submitted source archive, all = every artifact this
        review has, with no ctx.artifact - two of them in a source review, one in an XPI
        review, so a check on it tests for what it needs first. A check comparing the
        artifacts reads them by name as ctx.xpi and ctx.sca; one asking each of them the
        same question wraps its body in perArtifact, which runs it on each of them.
        A check that reads NO artifact - only the shared records, ctx.manifest and
        ctx.experiments - declares xpi, because both of those are the built XPI's:
        the route is then inert, and xpi is the artifact such a check is judging
    when:
      kind: text
      why: >-
        the condition the check runs under, over the facts known before any check runs
        (`sca`, `eslint`, `build-judged`, `build-safe`), in the syntax a prompt
        step's `when:` uses - for what a route
        cannot say, such as a check that judges the shipped XPI and must stay out of a
        source review (`NOT sca`), or one that runs only under --eslint (`eslint`).
        Leaving it out runs the check wherever its route does
    build-guard:
      kind: gate
      why: >-
        it marks a check an agent's build relies on: with any of these switched off
        (--checks-only / --checks-skip), the build check asks nobody about the build, the
        agent builds nothing, and the review asks build-review in its place
    collapse:
      kind: one-of
      values: COLLAPSE_MODES
      why: >-
        it asks for one line per subject instead of one per finding, and a typo would
        otherwise read as the default
    settle-verbs:
      kind: list
      why: >-
        the verbs a reviewer may settle this check's cases with, drawn from its phase's set
    sweep-instruction:
      kind: text
      why: >-
        what a reviewer is asked to sweep for where this check is blind to its own gap.
        A sweep names one tree, and on these routes the check's own `input` is that tree,
        so this form says nothing it would only be repeating
    sweep-instruction-for-xpi:
      kind: text
      why: >-
        the same, asked of the built XPI. Only `input: all` may author it - that route
        names no artifact, so a sweep on it has to say which one its reader is sent into
    sweep-instruction-for-sca:
      kind: text
      why: >-
        the same, asked of the source archive, and likewise only on `input: all`. A check
        that authors both gets two independent sweeps, one per tree
    review-early-exit:
      kind: text
      why: >-
        it names the reason the report gives for aborting at once, for the few findings
        after which the rest of the review is no use, and a reason with no name cannot be
        looked up
    review-late-exit:
      kind: text
      why: >-
        it names the reason the report gives for aborting once the review has run to the end
        of `settle`, the default way to abort, one of the `review-early-exit` reasons, and a
        reason with no name cannot be looked up
    asked-in:
      kind: text
      why: >-
        it names the loop phase a person is asked this check's question in, alone, where it
        cannot wait in the batch beside the others
    sent-on-to:
      kind: text
      why: >-
        it names the loop phase a case is sent on to where the agent answers it with `ask`
        in `settle`, in place of `ask`, so it is judged there against what a person hands it
    sent-on-instruction:
      kind: text
      why: >-
        what the agent is told to judge a case against in the phase it was sent on to, in
        place of the wording it screened the case's premise by in `settle`
    manual-choices:
      kind: entries
      shape: choice-entry
      name-key: label
      noun: "`manual-choices`"
      why: >-
        the answers this check's question offers in place of the ones every manual review
        question offers, worded for it, one cleared and one reported
    review-downgrade:
      kind: gate
      why: >-
        it says a review of the XPI alone cures this aborting check's finding, so a source
        review aborted only by such checks, whose XPI is readable, is offered a restart as
        an XPI review
    review-unbuildable:
      kind: gate
      why: >-
        it says this aborting check's finding makes a build impossible by the review's own
        rules, so a source review holding one asks nobody to build it and skips the build
        phases
    llm-verification:
      kind: boolean
      required: true
      why: >-
        it says whether the agent audits this check's findings in `verify`. Every check
        answers it, because a finding that records a person's decision or a fact from
        outside the add-on (an advisory, a banned version, a download count) is reported as
        it stands, and a check that forgot to say so would put it up for withdrawal. A
        comment beside every false says why
    llm-verification-instruction:
      kind: text
      why: >-
        it says what a finding of this check claims, which `verify` judges it against.
        Without it the agent guesses what the claim is, and withdraws a finding the check
        means to report whatever surrounds it
    escalation:
      kind: refused
      why: >-
        which nothing reads - a check names its READER instead, by authoring `instructions`
        (one text, either reader), `instructions-for-llm` beside `instructions-for-human`
        (one question each), or `instructions-for-human` alone

  # A to-do item printed in every review, not a check that runs - so it reads no artifact
  # and lists its case unconditionally.
  manual-entry:
    include: [identity, wording]
    escalation: &only-a-check-that-runs
      kind: refused
      why: >-
        which only a check that RUNS can carry - a manual-checks entry lists its case
        unconditionally and reads no artifact
    input:
      kind: one-of
      values: MANUAL_ENTRY_INPUTS
      required: true
      why: >-
        a by-hand entry reads no artifact - it is settled by looking at the add-on
        listing page, or by installing the add-on and using it - and says so rather
        than leaving an absent `input` to be read as a default. `none` is the whole
        vocabulary here, and a check that RUNS cannot declare it
    sweep-instruction: *only-a-check-that-runs
    sweep-instruction-for-xpi: *only-a-check-that-runs
    sweep-instruction-for-sca: *only-a-check-that-runs
    settle-verbs: *only-a-check-that-runs
    review-early-exit: *only-a-check-that-runs
    review-late-exit: *only-a-check-that-runs
    asked-in: *only-a-check-that-runs
    sent-on-to: *only-a-check-that-runs
    sent-on-instruction: *only-a-check-that-runs
    review-downgrade: *only-a-check-that-runs
    review-unbuildable: *only-a-check-that-runs
    llm-verification: *only-a-check-that-runs

  # The token vocabulary that can justify a permission. The two version bounds are
  # snake_case where every other field is kebab - deliberately, because they echo the
  # manifest.json key they are compared against (strict_min_version).
  prompt-entry:
    permissions:
      kind: text
      required: true
      why: >-
        the comma-separated permissions this entry speaks for; an entry naming none is read
        by nothing and would sit in the file doing nothing
    tokens:
      kind: list
      why: >-
        the code-level spellings that justify the permission. An entry with none is
        deliberate and means the permission cannot be decided deterministically, so
        unused-permission always escalates it
    min_strict_version:
      kind: version
      why: the lowest Thunderbird this entry's tokens apply to, inclusive
    max_strict_version:
      kind: version
      why: the highest Thunderbird this entry's tokens apply to, inclusive

  # One answer a reviewer may give an escalated case.
  choice-entry:
    label:
      kind: text
      required: true
      why: what the answer is called where it is offered
    verdict:
      kind: text
      required: true
      why: the verdict this answer settles the case with
    description:
      kind: text
      required: true
      why: what choosing it means, so the reader can choose

  # What one verb is worded as, on the pass that accepts it.
  verb-prose-entry:
    says:
      kind: text
      required: true
      why: >-
        when this verdict applies, so an entry offering it says what to choose on
    says-when-last-resort:
      kind: text
      why: >-
        the extra wording for the verb a reader falls back to, when there is one

  # One value a process-value pass (`answer: value`) accepts back.
  phase-value-entry:
    value:
      kind: text
      required: true
      why: >-
        the id a `when:` reads with value(phase, id), which is what the review records
    label:
      kind: text
      required: true
      why: what the value is called where it is offered, and what comes back
    description:
      kind: text
      required: true
      why: when it applies, so the one choosing can choose
    reports:
      kind: text
      why: >-
        the check whose finding this value adds to the review - the one way a process value
        aborts it, with that check's reason and response
    when:
      kind: text
      why: >-
        the condition the value is offered under, read like a step's `when:`, so an answer
        that means nothing in this review is not offered in it

  # One answer the build check's SCA_BUILD_OVERRIDE question offers.
  build-override-value-entry:
    value:
      kind: one-of
      values: BUILD_OVERRIDE_VALUES
      required: true
      why: >-
        the id the build check reads the reviewer's answer as: build nothing, or go on to the
        build decision as if the build were safe
    label:
      kind: text
      required: true
      why: what the answer is called where it is offered, and what comes back
    description:
      kind: text
      required: true
      why: what follows from it, so the reviewer can choose
    when:
      kind: text
      why: >-
        the condition the answer is offered under, read like a build check step's `when:`,
        so its wording can follow the build (a rescue named only for a vulnerable lock)

  # One answer the build check's SCA_BUILD_DECISION question offers.
  build-decision-value-entry:
    value:
      kind: one-of
      values: BUILD_DECISION_VALUES
      required: true
      why: >-
        the id the build check records the reviewer's decision as, which decides whether the
        build is safe and whether the agent builds the add-on and runs its package-manager
        commands
    label:
      kind: text
      required: true
      why: what the answer is called where it is offered, and what comes back
    description:
      kind: text
      required: true
      why: what follows from it, so the reviewer can choose
    when:
      kind: text
      why: >-
        the condition the answer is offered under, read like a build check step's `when:`,
        so an answer that means nothing for this build (a rescue of a clean lock) is not
        offered

  # One pass of the review loop: what it asks, what it accepts back, and its steps.
  loop-phase-entry:
    name:
      kind: text
      required: true
      why: the pass's name, which the loop addresses it by
    intro:
      kind: text
      required: true
      allow-empty: true
      why: what the pass tells its reader before its steps
    answer:
      kind: one-of
      values: ANSWER_KINDS
      required: true
      why: >-
        what one entry of this pass is answered WITH, which decides the shape it is handed
        over in and what the linter accepts back
    verbs:
      kind: list
      required: true
      allow-empty: true
      why: the verdicts this pass accepts - empty for a pass that takes none
    ends-turn:
      kind: gate
      why: >-
        the pass shows a block the reviewer must read and ends the agent's turn with it,
        the linter appending the waiting line to that block
    steps:
      kind: list
      of: mapping
      required: true
      why: what the pass tells its reader to do, in order
    verb-prose:
      kind: map-of
      shape: verb-prose-entry
      why: what each verdict this pass accepts means, worded per verb
    question:
      kind: text
      why: >-
        the question a process-value pass hands over where no check routes a to-do to it,
        relayed as it is written, with {{abortReasons}} filled from what aborted the review
    values:
      kind: entries
      shape: phase-value-entry
      name-key: value
      noun: "`values`"
      why: the process values this pass accepts back, one of which comes back

sections:
  deterministic-phase:
    kind: entries
    shape: rule-entry
  manual-checks:
    kind: entries
    shape: manual-entry
  permission-prompts:
    kind: entries
    shape: prompt-entry
  llm-manual-review-choices:
    kind: entries
    shape: choice-entry
    name-key: label
    noun: answers

  # The two CLOSED prose maps: a report looks their keys up, so a key it cannot reach is
  # prose nobody will ever read.
  issue-headings:
    kind: prose-map
    required: SEVERITY_BANDS
    closed: true
    noun: prose
    why: what the report says above each band's findings
  verdict-intros:
    kind: prose-map
    required: VERDICT_KEYS
    closed: true
    noun: prose
    why: how the report opens, per verdict
  review-early-exit:
    kind: object
    noun: "`review-early-exit` section"
    fields:
      intro:
        kind: text
        required: true
        why: >-
          what introduces the list of reasons, which would otherwise print with nothing
          saying what it is
      reasons:
        kind: prose-map
        required: []
        must-exist: true
        why: >-
          what the report calls each reason a review can stop for - the ids a check names in
          `review-early-exit` or `review-late-exit`

  llm-sca-review-prompt:
    kind: object
    noun: prompt
    fields:
      intro:
        kind: text
        required: true
        why: what the prompt tells its reader first
      experiment-folder:
        kind: list
        of: mapping
        required: true
        noun: "`experiment-folder` steps"
        why: >-
          the steps the prompt that has the Experiment folder named in the extracted source
          asks for, in order
      analyze:
        kind: list
        of: mapping
        required: true
        noun: "`analyze` steps"
        why: >-
          the steps the prompt that has the build worked out and judged asks for, in order
      override-unsafe:
        kind: list
        of: mapping
        required: true
        noun: "`override-unsafe` steps"
        why: >-
          the steps the prompt that shows the build details after an unsafe verdict and asks
          the reviewer whether to override it asks for, in order
      decision:
        kind: list
        of: mapping
        required: true
        noun: "`decision` steps"
        why: >-
          the steps the prompt that shows the build details, where the override-unsafe prompt
          did not, and asks the reviewer's build decision asks for, in order
      build:
        kind: list
        of: mapping
        required: true
        noun: "`build` steps"
        why: the steps the prompt that builds a clean original asks for, in order
      rescue:
        kind: list
        of: mapping
        required: true
        noun: "`rescue` steps"
        why: >-
          the steps the prompt that rescues and builds a vulnerable source's copy asks for,
          in order
      build-output:
        kind: object
        required: true
        noun: "`build-output` question"
        why: the entry the build prompt names what the build produced in
        fields:
          question:
            kind: text
            required: true
            why: what the entry asks, relayed as it is written
          failed:
            kind: object
            required: true
            noun: "`failed` answer"
            why: the one answer the entry offers besides a path
            fields:
              label:
                kind: text
                required: true
                why: what the entry accepts back where nothing was produced
              description:
                kind: text
                required: true
                why: when that answer applies, so the one answering can choose it
      rescue-output:
        kind: object
        required: true
        noun: "`rescue-output` question"
        why: the entry the rescue prompt names what the rescued copy's build produced in
        fields:
          question:
            kind: text
            required: true
            why: what the entry asks, relayed as it is written
          failed:
            kind: object
            required: true
            noun: "`failed` answer"
            why: the one answer the entry offers besides a path
            fields:
              label:
                kind: text
                required: true
                why: what the entry accepts back where nothing was produced
              description:
                kind: text
                required: true
                why: when that answer applies, so the one answering can choose it
      build-override:
        kind: object
        required: true
        noun: "`build-override` question"
        why: >-
          whether the reviewer overrides an unsafe verdict, put in the override-unsafe prompt
          before the build decision
        fields:
          question:
            kind: text
            required: true
            why: what the reviewer is asked, relayed as it is written
          values:
            kind: entries
            shape: build-override-value-entry
            name-key: value
            required: true
            noun: "`values`"
            why: the two answers the question offers, skip and continue
      build-decision:
        kind: object
        required: true
        noun: "`build-decision` question"
        why: >-
          the reviewer's one decision about the build, put in the decision prompt after a
          safe verdict or an overridden unsafe one
        fields:
          question:
            kind: text
            required: true
            why: what the reviewer is asked, relayed as it is written
          values:
            kind: entries
            shape: build-decision-value-entry
            name-key: value
            required: true
            noun: "`values`"
            why: the two answers the question offers, allow and manual

  llm-phases:
    kind: object
    noun: loop prompts
    fields:
      preamble:
        kind: list
        of: mapping
        required: true
        noun: "`preamble` parts"
        why: >-
          what the first prompt tells its reader before anything else, part by part, each
          printed where its `when:` condition holds
      frame: &loop-text
        kind: text
        required: true
        why: a loop text the linter fills and prints
      handover: *loop-text
      prose-style:
        kind: text
        required: true
        why: >-
          how an agent writes the prose of its own the reviewer and the developer read, said
          once in the first prompt of a run and in each request a sub-agent is handed
      reading-rule:
        kind: text
        required: true
        why: >-
          how the agents that read the add-on's files read them, every line of every file,
          said in the description request and in each sweep request
      waiting:
        kind: object
        required: true
        noun: "`waiting` line"
        fields:
          text: *loop-text
          next:
            kind: prose-map
            required: []
            must-exist: true
            why: >-
              what the reply to the waiting line leads to, by the block it ends: `decision`
              or a turn-ending phase. The entry for `ask` names how many questions follow
              ({{count}})
      refused: *loop-text
      build-results:
        kind: prose-map
        required: WORDED_BUILD_FACTS
        closed: true
        noun: prose
        why: what the details blocks' LLM_BUILD_RESULT row says came of the agent's build, per result shown
      restart:
        kind: object
        shape: loop-phase-entry
        required: true
        why: >-
          the prompt that offers an aborted source review a restart as an XPI review, in
          place of the close, shaped as a process-value phase
      phases:
        kind: entries
        shape: loop-phase-entry
        name-key: name
        required: true
        why: the passes the loop runs, in order
