# Note: Responses should not contain line breaks, as they can be copied into the
#       response window on ATN, which will reflow them. Line breaks will create
#       ugly-looking response messages sent to the developer.
#
# The check-bearing sections below ARE the phases: a check's phase IS the section it
# lives in, so no entry declares one. The orchestrator (runChecks) knows this closed set
# and looks up the phases it wants, in the order it runs them - invalid-experiment (which
# short-circuits the whole review), then deterministic. A section it never asks for is inert, so
# every other top-level section here (permission-prompts, manual-checks, messages, ...) is
# simply not a phase.

# The reject phase: when the add-on is an invalid Experiment, this is the ONLY phase that
# runs - no other check, no manual list.
invalid-experiment-phase:
# Aborts the review of an Experiment that uses an UNSUPPORTED experiment (an
# unknown API draft, or one shadowing a built-in). A recognised but modified draft
# does NOT land here; it is reviewed normally and flagged by experiment-modified.
# The per-experiment reason is appended to each location line.
- title: Experiment APIs not accepted
  severity: error
  check: experiment-not-allowed
  input: source
  response: |-
    We are currently not accepting new submissions using Experiment APIs, except unmodified copies of the latest published API drafts (https://github.com/thunderbird/webext-experiments). The following cannot be accepted:
    Read more: https://thunderbird.topicbox.com/groups/addons/T6ff545fb6d479da5/temporary-pause-on-new-experiment-api-add-on-reviews

deterministic-phase:
# Flags a privileged core global (Services, ChromeUtils, Components/Cc/Ci/Cu, ...)
# referenced in pure WebExtension code, where the sandbox does not provide it. The
# Experiment dependency tree (and its mixed/unsure files) is exempt.
- title: Privileged core symbol in WebExtension code
  severity: error
  check: core-symbol-in-webext
  input: source
  response: |-
    This add-on is using privileged Thunderbird internals in a WebExtension context, where they are not available: background, content, options and popup scripts run in a sandbox without chrome privileges. Remove the usage.

# Flags use of a Mozilla/Thunderbird trademark in the add-on name (the icon is a
# separate manual check).
- title: Trademark violation
  severity: error
  check: trademark-violation
  input: xpi
  response: |-
    This extension uses a registered trademark of Mozilla in its name or icon and is unallowable under Mozilla’s Trademark Policy (https://www.mozilla.org/foundation/trademarks/policy/). For Mozilla trademarks, the usage of “Mozilla” and “Thunderbird” are generally not allowed in the add-on name, except in the following format: “ADD-ON NAME for Thunderbird.”

# Flags API namespaces or members absent from the schema, or marked unsupported.
- title: Unknown or unsupported WebExtension API
  severity: error
  check: unknown-api
  escalation: code-review
  input: source
  response: |-
    The following WebExtension APIs are not supported in the targeted Thunderbird version.
    Read more: https://webextension-api.thunderbird.net/.
  instructions: |-
    Each reference below is to a name the schema does not have, or marks
    unsupported, for the targeted Thunderbird version. Check whether this
    reference is guarded, so the add-on still works where the name is missing. A
    feature detection with a working fallback, a shim, a try/catch all count.
    Report it unless you can point at the guard.

# Flags deprecated APIs.
- title: Deprecated WebExtension API
  severity: info
  check: deprecated-api
  input: source
  response: |-
    The following APIs are deprecated in the targeted Thunderbird version. Please migrate to supported APIs.
    Read more: https://webextension-api.thunderbird.net/.

# Flags functions/events added after the declared strict_max_version: the add-on
# caps support below the Thunderbird where the API first appeared.
- title: API newer than strict_max_version
  severity: error
  check: strict-max-version-api
  input: source
  response: |-
    The add-on is setting strict_max_version to {{max}} but uses functions or events added in a later Thunderbird. Raise strict_max_version, or stop using these APIs.

# Flags an API call whose required permission is not declared.
- title: Missing permission
  severity: error
  check: missing-permission
  input: source
  response: |-
    The following permissions are required at the locations listed, but are not declared in the manifest. Add them to the requested permissions.

# Flags an API call that needs a manifest key (e.g. "action") not declared.
- title: Missing manifest key
  severity: error
  check: missing-manifest-key
  input: source
  response: |-
    The following APIs each need a manifest key that is not declared. Add one of the keys named for each API to manifest.json.

# manifest.json is present but not valid JSON.
- title: Invalid manifest JSON
  severity: error
  check: manifest-invalid-json
  input: manifest
  response: |-
    Invalid manifest.json: manifest.json is not valid JSON.
    Read more: https://webextension-api.thunderbird.net/.

# No manifest.json at the add-on root.
- title: Missing manifest
  severity: error
  check: manifest-missing
  input: manifest
  response: |-
    Invalid manifest.json: no manifest.json at the add-on root.
    Read more: https://webextension-api.thunderbird.net/.

# A required top-level manifest key is absent.
- title: Missing required manifest key
  severity: error
  check: manifest-missing-key
  input: manifest
  response: |-
    Invalid manifest.json: one or more required properties are missing.
    Read more: https://webextension-api.thunderbird.net/.

# manifest_version disagrees with the schema set being reviewed.
- title: Manifest version mismatch
  severity: error
  check: manifest-version-mismatch
  input: manifest
  response: |-
    Invalid manifest.json: manifest_version {{item}} does not match the schema set (Manifest V{{schema}}).
    Read more: https://webextension-api.thunderbird.net/.

# A declared permission value that is neither a known permission, a
# data-collection permission, nor a match pattern.
- title: Unknown permission
  severity: error
  check: manifest-unknown-permission
  input: manifest
  response: |-
    Invalid manifest.json: one or more requested permissions are unknown.
    Read more: https://webextension-api.thunderbird.net/.

# A self-hosted update_url (browser_specific_settings.gecko or the legacy
# applications.gecko) points updates outside ATN, so a later version could install
# unreviewed code. Not accepted, in either location, any manifest version.
- title: Self-hosted update URL
  severity: error
  check: update-url
  input: manifest
  response: |-
    This add-on sets an update_url, which directs Thunderbird to install updates from a self-hosted location instead of ATN (addons.thunderbird.net). Because those updates bypass review, an add-on using update_url cannot be listed on ATN. Remove update_url from browser_specific_settings.gecko (or applications.gecko).

# An unknown top-level manifest key (Thunderbird ignores it).
- title: Unrecognized manifest key
  severity: info
  check: unrecognized-manifest-key
  input: xpi
  response: |-
    Invalid manifest.json: the following top-level keys are unknown and will be ignored by Thunderbird.
    Read more: https://webextension-api.thunderbird.net/.

# A known manifest key with a wrong-typed value (Thunderbird misreads it).
- title: Mistyped manifest value
  severity: warning
  check: mistyped-manifest-value
  input: manifest
  response: |-
    The following manifest entries have a value Thunderbird ignores or misreads.
    Read more: https://webextension-api.thunderbird.net/.

# Flags manifest/loader references (scripts, popups, icons, ...) to files not in
# the package.
- title: Missing referenced file
  severity: error
  check: bundled-files
  input: xpi
  response: |-
    The following referenced file(s) are not bundled with the add-on, or the path may be wrongly specified. Please include every referenced file in the package, and check that the used paths are correct.

# Flags a packaged file the add-on loads (manifest reference or <script src>) whose file type
# is not recognized, so no check could review it - the backstop for the JS-corpus suffix set.
- title: Unrecognized referenced file type
  severity: error
  check: unrecognized-file-type
  input: xpi
  response: |-
    The following packaged file(s) are referenced by the add-on ({{referrer}}) but have a file type the review tools do not recognize, so they could not be classified or reviewed. The browser still loads them. Please give each a standard extension for its content (for example a .js script), or confirm what the file is and why it is shipped. If this is a build artifact your packaging step emitted, review what your build produces.

# Flags synchronous XMLHttpRequest (open(..., false)), which blocks the UI thread.
- title: Synchronous XMLHttpRequests
  severity: error
  check: sync-xhr
  input: source
  response: |-
    The add-on makes a synchronous XMLHttpRequest, which can lock up the user interface. Please use an asynchronous request instead.

# Flags every write to innerHTML/outerHTML/srcdoc/insertAdjacentHTML (only
# Element.setHTML() is sanctioned); an empty-string/null clear is exempt.
- title: Modifying innerHTML; use Element.setHTML()
  severity: info
  check: unsafe-html
  input: source
  response: |-
    Inserting markup via the following properties or methods will soon no longer be permitted. The only supported way to do so is the Sanitizer API (Element.setHTML(), Thunderbird 148+). Please also consider alternatives to (re-)building the live DOM (use textContent, a <template>, or CSS to show and hide existing elements).
    Read more: https://webextension-api.thunderbird.net/en/mv3/guides/innerHTML.html.

# Flags unconditional debugger statements left in shipped code.
- title: Debugger statement
  severity: error
  check: debugger-statement
  escalation: code-review
  input: source
  instructions: |-
    A debugger statement is acceptable only when it is guarded by a build or
    configuration flag, or by a setting in the add-on's options. Read the
    enclosing condition, if any, and decide whether it is properly guarded and
    does not run unconditionally.
  response: |-
    Debugger statement left in shipped code. Please remove it or move it behind a build or configuration flag.

# Flags an async listener passed to the addListener() of a runtime message event -
# one that answers the sender with whatever its listener returns.
- title: Async listener on a runtime message event
  severity: warning
  check: async-onmessage
  input: source
  response: |-
    An asynchronous listener is attached to the following runtime message event(s). An async listener always returns a Promise, which claims the response for every message it sees - including the ones it declines - so the other listeners never get to answer. This is error-prone and must be avoided.
    Read more: https://webextension-api.thunderbird.net/en/mv3/guides/runtimeMessaging.html

# ESLint correctness rules (no-redeclare/no-shadow/no-empty/no-unreachable/...)
# over the add-on’s authored JS. Style/fixable rules are excluded (read-only tool).
- title: JavaScript code errors
  severity: info
  check: code-sanity
  input: source
  eslint: true
  response: |-
    Static analysis flagged the following likely code error(s).

# Flags broad host permissions (<all_urls> or a "*" host) requested as required.
- title: Minimize host permissions
  severity: info
  check: minimize-host-permissions
  input: manifest
  response: |-
    The manifest requests one or more very broad host permissions that are granted at install. Request only the specific hosts your add-on actually needs. If it genuinely needs broad access, declare them as optional host permissions so the user can grant them on demand rather than up front.
    Read more: https://thunderbird.topicbox.com/groups/addons/Tafa58394231a18f8-M3e565a75287313ea4395ff5f/prefer-to-use-optionalhostpermissions-to-get-around-cors-issues-with-fetch

# Producer of the declared permissions worth a closer look: every declared NAMED
# permission a reachable API call does not provably require (host patterns are
# Minimize host permissions' concern). Runs in the main loop. A permission whose
# entries (see permission-prompts) declare usage `tokens` that appear
# NOWHERE in the add-on's live code (comments excluded) or manifest is
# deterministically unused - a warning finding (the deterministic path stands
# down when the scan is blind: an SCA review or unresolved dynamic API surface).
# Every other case is scheduled as a manual-review escalation; same-bodied cases
# auto-group into the one reminder here.
- title: Possibly unused permissions
  severity: warning
  check: unused-permission
  escalation: code-review
  input: xpi
  response: |-
    One or more declared permissions appear to be unused. An add-on should request only the permissions it needs, to keep the install-time permission prompt minimal. Please remove any permission your add-on does not use, or let us know which part of the add-on stops working without it.
  instructions: |-
    Review whether the following declared permissions are used, and ask the
    developer to remove any that are not needed.

# Flags a bundled file whose content hash matches a known third-party library
# release (named after each path) that is not declared in a VENDOR file.
- title: Missing third-party library reference
  severity: info
  check: missing-library
  input: source
  response: |-
    The following bundled files were recognized as third-party libraries (via Mozilla library hash database), but are not declared as such. Please declare each and link its source so the (unmodified) bundled copy can be verified against the linked version - a VENDOR.md file at the add-on root is common practice.
    Read more: https://webextension-api.thunderbird.net/en/mv3/guides/vendoring.html.

# Flags a bundled file the Mozilla hash DB did not recognize but whose exact bytes
# were found on the jsDelivr CDN - a known third-party library, shipped undeclared.
- title: Library identified on a CDN
  severity: info
  check: find-lib-on-cdn
  input: source
  response: |-
    The following bundled files were recognized as third-party libraries (via jsDelivr CDN hash lookup), but are not declared as such. Please declare each and link its source so the (unmodified) bundled copy can be verified against the linked version - a VENDOR.md file at the add-on root is common practice.
    Read more: https://webextension-api.thunderbird.net/en/mv3/guides/vendoring.html.

# Flags a JS file that cannot be reviewed as shipped - minified, machine-generated, or
# not parsable as JavaScript (maxLineStatements cannot count what it could not parse, so
# an unparsable file with a long line reads as packed) - and is not a recognized library;
# asks for the readable original. Runs in both XPI and source-code submission reviews (no sca gate) - a
# source submission's promise is readable source, so a minified file there is
# rejected just like one in a built XPI.
- title: Minified code cannot be reviewed
  severity: error
  check: minified-code
  input: source
  response: |-
    The following file(s) cannot be reviewed in this form: they are minified, machine-generated, or not parsable as JavaScript. If a file is a third-party library, declare it as such and link its source so the (unmodified) bundled copy can be verified against the linked version (a VENDOR.md file at the add-on root is common practice). If it is your own code, provide the original, human-readable source for it - the add-on does not need to be minified. Where the readable code is produced by a build step, supply the build's sources and the instructions needed to reproduce the shipped XPI, using the source code upload field available during submission or on the version page in the developer hub. Note that the source-archive route slows review down, as it requires manually verifying the build process and that it reproduces the shipped XPI. If a file is not JavaScript at all - data shipped with a .js name, say - give it an extension that matches its content.
    Read more #1: https://webextension-api.thunderbird.net/en/mv3/guides/vendoring.html.
    Read more #2: https://extensionworkshop.com/documentation/publish/source-code-submission/

# Flags a bundled file the tool could not confirm as a reviewed dependency AND which
# is minified/obfuscated - untrusted and unreviewable, so a readable build is
# required. Four routes reach it (see applyUnverifiedVendor / cdn-lookup): the bytes
# match an upstream release whose package is not widely used, or the declared source
# was never checked - not declared, an untrusted host, or no such release.
- title: Source Archive (unverified library) required
  severity: error
  check: untrusted-minified-library
  input: source
  response: |-
    The following bundled file(s) are third-party libraries whose origin we could not confirm - either the file matches an upstream release whose package is not a widely-used library, or the declared source could not be checked at all (none was given, it is on a host we do not fetch from, or it has no such release). Either way the file is not trusted as a reviewed dependency - and it is minified or otherwise machine-generated, so it cannot be reviewed in this form. Ship the original, human-readable code directly (it need not be minified), or upload the original sources as a source-code submission (with the build instructions and process needed to reproduce the shipped XPI) using the source code upload field during submission or on the version page in the developer hub. Note that the source-archive route slows review down, as it requires manually verifying the build.
    Read more #1: https://webextension-api.thunderbird.net/en/mv3/guides/vendoring.html.
    Read more #2: https://extensionworkshop.com/documentation/publish/source-code-submission/

# Notes a bundled file the tool could not confirm as a reviewed dependency (the same
# four routes as above) and which IS readable - so it is reviewed as the developer's
# own code rather than trusted as a vendored dependency.
- title: Library reviewed as authored code
  severity: info
  check: untrusted-library
  input: source
  response: |-
    The following bundled file(s) are third-party libraries whose origin we could not confirm - either the file matches an upstream release whose package is not a widely-used library, or the declared source could not be checked at all (none was given, it is on a host we do not fetch from, or it has no such release). They are therefore not trusted as reviewed dependencies and are reviewed as authored code - the standard checks apply to them, so a finding may be reported against library code here. Confirm that each is a legitimate, appropriate dependency.
    Read more: https://webextension-api.thunderbird.net/en/mv3/guides/vendoring.html.

# SCA mode (source code archive, sca: true): a declared dependency that is not
# a confirmed widely-used library cannot be reviewed - its code is pulled in at
# build, absent from the readable source and mangled in the built XPI - so the
# developer must ship it readable inside --sca-source. verifyScaDependencies
# records the non-popular package.json dependencies (vendor.unpopularDeps).
- title: Unreviewable build dependency
  severity: error
  sca: true
  check: unpopular-source-dependency
  input: source
  response: |-
    The following dependencies could not be confirmed to be widely-used. They need to be packaged non-minified with the add-on in order to be reviewed.
    Read more: https://webextension-api.thunderbird.net/en/mv3/guides/vendoring.html.

- title: Unparsable file
  severity: info
  check: unparsable-file
  input: source
  response: |-
    Limited static-analysis coverage: could not be parsed, so API checks were skipped ({{detail}})

# Flags a recognised published Experiment draft that is bundled modified or
# outdated (it would be accepted if it were the unmodified latest upstream copy).
- title: Modified or outdated Experiment draft
  severity: error
  check: experiment-modified
  input: source
  response: |-
    The following Experiment API(s) are published Thunderbird API drafts, but this add-on bundles a modified or outdated copy of each. Bundle the unmodified latest version from https://github.com/thunderbird/webext-experiments.

# Flags an accepted Experiment (--allow-experiments) that declares no
# strict_max_version.
- title: Experiment missing strict_max_version
  severity: error
  check: experiment-missing-strict-max-version
  input: manifest
  response: |-
    This add-on uses Experiment APIs but declares no strict_max_version. Experiments rely on internal APIs that change between major Thunderbird versions, so they must set browser_specific_settings.gecko.strict_max_version.

# Flags an Experiment whose declared API overrides or grafts onto a built-in
# Thunderbird API instead of adding a new one.
- title: Experiment overrides a built-in API
  severity: error
  check: experiment-overrides-api
  input: manifest
  response: |-
    The following Experiment API(s) override or extend a built-in Thunderbird API. Experiments may only add new APIs, never replace or graft onto existing ones. Please expose this functionality under new, distinct API namespaces.

# A whole-add-on review raised for every Experiment submission: Experiments have full
# access to Thunderbird internals, so nothing here is proved by scanning and a person has
# to look. The reviewer clears it or it is reported, which is why it carries a real
# severity - and its response is a SCAFFOLD, leading with the requirement and ending in an
# empty bullet for the reviewer to list what they found beneath (as no-surprises-policy
# ends in a placeholder). The response is printed verbatim, so that bullet survives.
- title: Experiment manual review
  severity: error
  check: experiment-manual-review
  escalation: manual-review
  input: manifest
  instructions: |-
    This submission ships an Experiment, which runs with full access to
    Thunderbird's internals. Verify that its Experiment surface is no larger than
    the add-on needs, and that it does not affect Thunderbird's usability,
    stability, performance or security. Reviewing only the differences from the
    last approved submission can save time. Report this unless all of that holds.
  response: |-
    This add-on ships an Experiment, which runs with full access to Thunderbird's internals. Its Experiment surface must be kept to what the add-on actually needs, and must not affect Thunderbird's usability, stability, performance or security. The following need to be addressed:

    - ...

# Raises a code review when an Experiment calls a WebExtension API the schema does not
# recognize - usually a typo in the add-on's OWN experiment schema, which reads like a
# false-positive unsupported-API finding. The two outcomes are EXCLUSIVE, which is why the
# instructions spell both out: the names are typos, so this is reported and unknown-api's
# findings for those APIs are withdrawn, or the APIs genuinely do not exist, so this is
# cleared and those findings stand. Whoever settles it settles both at once, which is what
# keeps the developer from receiving two contradictory answers.
- title: Experiment with unrecognized API usage
  severity: error
  check: experiment-unknown-api
  escalation: code-review
  input: source
  instructions: |-
    This Experiment calls WebExtension APIs the schema does not recognize (see the
    "Unknown or unsupported WebExtension API" findings). For an experiment's OWN API
    this is usually a typo in that experiment's schema: the schema's `namespace` is the
    sole authority for the API name, so if it does not match the API the code calls
    (regardless of the manifest's experiment_apis key or parent.paths), the API is
    undefined. Read every experiment schema. If the names are typos, report this and
    withdraw the "Unknown or unsupported WebExtension API" findings for those APIs. If
    the APIs genuinely do not exist, clear this and let those findings stand.
  response: |-
    This Experiment calls WebExtension APIs that no schema defines. Where these are your own Experiment APIs, each experiment's schema must declare a `namespace` matching the name the code calls, since the namespace is authoritative and a mismatch leaves the API undefined even when the manifest declares it. Please correct the schema namespaces, or remove the calls to APIs that do not exist.

# Flags a non-Experiment that pins strict_max_version (only blocks newer
# Thunderbird; the APIs are forward-compatible).
- title: Unnecessary strict_max_version
  severity: warning
  check: non-experiment-strict-max-version
  input: manifest
  response: |-
    This add-on pins strict_max_version "{{item}}". The WebExtension APIs are stable and designed to keep add-ons forward-compatible across Thunderbird versions, so a maximum version is usually unnecessary and only blocks installs on newer Thunderbird.

# Third-party (vendored) declarations - a package.json with dependencies, or a
# VENDOR file listing files and their source URLs - are resolved and verified
# once before the review (src/vendor/*: parse, pin, fetch, byte-compare,
# popularity), for EACH artifact that carries them: the shipped XPI, and a
# submitted source archive, whose declared files are likewise committed and
# present to compare. Verification is what earns a declaration its exemption
# from content review - an entry that does not verify is reconciled into the
# untrusted family and the file is reviewed as the developer's own code - so
# none of these checks is gated on the review mode. The checks below read that
# precomputed result: three reject a submission (an unpinnable dependency, a
# non-pinned source, or a modified file), one escalates the unverifiable cases
# to manual review, and one warns when a declared file is missing.
- title: Unpinned dependency
  severity: error
  check: unpinned-dependency
  input: source
  response: |-
    The following dependencies are not pinned to an exact version. A version range can resolve to different releases over time, so the bundled copy cannot be verified against a known upstream. Pin each to an exact version in package.json, or commit the lock file (package-lock.json, npm-shrinkwrap.json, yarn.lock, or pnpm-lock.yaml) that records the exact version used.

# A package.json dependency from a source the review cannot identify or verify -
# only npm (pinned) and GitHub URLs are supported. Rejects everything else.
- title: Unsupported dependency source
  severity: error
  check: unsupported-dependency
  input: source
  response: |-
    The following dependencies are declared from a source the review cannot identify or verify. Only npm packages (pinned to an exact version or recorded in a committed lock file) and GitHub URLs are supported. Re-declare each as a pinned npm package or a GitHub source, or bundle the library with the add-on as non-minified authored code so it can be reviewed directly.

# Each pinned npm name@version - a package.json dependency or an npm-sourced
# VENDOR entry - is audited against the OSV database (src/vendor/verify.js); a
# package with known advisories is reported here.
# severity:auto - the check sets each finding's severity from the advisory's OSV
# band (high/critical -> error, moderate/medium -> warning, else info).
- title: Vulnerable dependency
  severity: auto
  check: vendor-vulnerable
  input: source
  response: |-
    A bundled dependency has known security vulnerabilities: {{item}} ({{version}}) is affected by published advisories of {{severity}} severity ({{ids}}). Update {{item}} to {{fixed}} or later, re-bundle, and resubmit.

# A bundled library version Mozilla's add-on policy disallows (banned) or discourages
# (unadvised), matched against the curated assets/library-blocks.yaml BEFORE the OSV
# audit (src/vendor/verify.js) - a banned version also skips the OSV request. Distinct
# from vendor-vulnerable (published CVE advisories); this is Mozilla policy, which can
# ban a version with no formal advisory.
# severity:auto - banned -> error, unadvised -> warning (set by the banned-library check).
- title: Banned library
  severity: auto
  check: banned-library
  input: source
  response: |-
    A bundled library version is {{status}} by Mozilla's add-on policy: {{item}} ({{version}}) - {{reason}} Update to a permitted version and re-bundle.

# Each pinned npm devDependency is OSV-audited in SCA mode too (src/vendor/verify.js
# verifyScaDependencies): the reviewer builds the add-on from source, so a
# vulnerable build-time dependency runs on the reviewer's machine even though it is
# never shipped. Mirrors vendor-vulnerable (same severity:auto band mapping) for the
# dev set; sca:true - dev deps only exist in an SCA review.
- title: Vulnerable build dependency
  severity: auto
  sca: true
  check: vendor-vulnerable-dev
  input: source
  response: |-
    A build dependency (devDependency) has known security vulnerabilities: {{item}} ({{version}}) is affected by published advisories of {{severity}} severity ({{ids}}). It is not shipped, but reviewers build the add-on from source, so it runs on the reviewer's machine during the build. Update {{item}} to {{fixed}} or later and resubmit.

# Deterministic (SCA only): the build must use npm or pnpm - the two package managers
# that share the .npmrc config format, keeping the reviewable surface small. A committed
# yarn/bun fingerprint anywhere in the build corpus (a lockfile, or the package.json
# "packageManager" field) is a hard reject; the offending tool is surfaced as {{item}}
# and the finding anchors at the fingerprint file. Pinning is a separate check
# (unpinned-dependency); the open-ended build review is undeclared-build-source.
- title: Unsupported build tool
  severity: error
  sca: true
  check: unsupported-build-tool
  input: build
  response: |-
    This add-on is built with {{item}}, and only npm and pnpm are supported. Please provide an npm or pnpm build (commit a package-lock.json or pnpm-lock.yaml) so the dependency install can be reviewed against the declared dependencies.

# Deterministic (SCA only): a committed .npmrc that SETS a package registry (registry=
# or @scope:registry=, case-insensitive) is rejected outright - a legitimate build never
# needs to set the registry (npm defaults to the public one), and any setting can only
# point the install at another source, pulling the SAME declared package names from an
# UNDECLARED source and leaving package.json/lock a clean decoy. The value is not parsed;
# the raw value is surfaced as {{item}}. Every .npmrc in the build corpus is scanned (a
# build can run from a subfolder), and .npmrc is the one dotfile kept there.
- title: Build registry override
  severity: error
  sca: true
  check: build-registry-redirect
  input: build
  response: |-
    The following .npmrc file(s) set a package registry, which is not allowed. Remove the registry setting - the build must resolve every dependency from the default public npm registry (registry.npmjs.org). A custom registry pulls the declared package names from an undeclared source, making package.json and the lock file a decoy.

# Deterministic (SCA only): a node_modules folder anywhere in --sca-root is a hard
# reject. Installed dependencies are build output - the reviewer installs them from the
# declared package.json/lock - so a committed node_modules is useless bloat and a decoy
# (its bytes can differ from the declared deps). node_modules is never read: the loader
# skips it at load and records only the directory paths, surfaced here as {{item}}.
- title: Committed node_modules folder
  severity: error
  sca: true
  check: committed-node-modules
  input: build
  response: |-
    The following committed node_modules folder(s) are not allowed. The declared dependencies are installed from package.json/lock during the build, so node_modules must never be part of the submission. Remove them and resubmit.

# Deterministic (SCA only): a committed binary archive (.zip/.xpi/.crx/...) anywhere in
# --sca-root is a hard reject. A built archive is build output the reviewer reproduces from
# source, so a committed one is useless bloat and a decoy (its bytes can differ from what the
# build produces). Recorded at load, spanning the whole submission, and surfaced as {{item}}.
- title: Committed build artifact
  severity: error
  sca: true
  check: committed-build-artifact
  input: build
  response: |-
    The following committed build artifact(s) are not allowed. A built archive (a .xpi/.zip) is produced from the source during the build and must never be part of the submission, where its bytes cannot be verified against what the build produces. Remove them and resubmit.

# SCA only: a package.json install lifecycle hook (preinstall / install / postinstall /
# prepare / prepublish) runs arbitrary code when the reviewer installs the dependencies,
# BEFORE the build - a known supply-chain vector (a postinstall that fetches and runs
# remote code). Legitimate uses exist (a husky `prepare`), and only the command itself
# says which this is, so every hook escalates for a reviewer to read rather than being
# asserted as a finding. The setup build analysis also covers hooks, but only with a
# token; this is the offline backstop. The hook and its command ride the locus.
- title: Build install hook
  severity: error
  sca: true
  check: build-lifecycle-hook
  escalation: code-review
  input: build
  instructions: |-
    The package.json declares the install lifecycle hook(s) below, which run when the
    reviewer installs the dependencies, before the build. Read each command and
    confirm it only runs local build steps, fetching or executing nothing remote
    (curl/wget, a download-and-run, or a git clone of an unpinned repo).
  response: |-
    The package.json declares an npm install lifecycle hook that fetches or executes remote code when the dependencies are installed. Every part of the build must come only from the dependencies declared in package.json/lock. Please remove the remote fetch or execution from the hook.

# SCA only: the build review. selectBuildCorpus finds the build ONCE in setup
# (src/build/analyze.js), storing addon.buildFiles.buildReview; this check reads it. A build
# must not fetch or execute code/resources from an UNDECLARED external source (a raw URL,
# curl|sh, a git clone of an unpinned repo, a CDN, a postinstall hook) - only installing the
# declared dependencies (npm ci from node_modules, importing a declared package) is allowed.
# Nothing decides that from the files, so every build escalates and the reviewer reproduces
# it: their attestation that the source produces the shipped XPI is what the SCA review rests
# on. {{unresolvedBuildSteps}} names the steps the linter could not follow and
# {{buildInstructions}} how the source says to build, both in the manual instructions.
- title: Build process review
  severity: error
  sca: true
  check: undeclared-build-source
  escalation: manual-review
  input: build
  instructions: |-
    Confirm by hand that the shipped XPI is produced by this source: reproduce the
    build and compare the result against the submitted XPI. Confirm the build pulls
    ONLY from the dependencies declared in package.json/lock - no remote code or
    resources from a raw URL, curl/wget, a git clone of an unpinned repo, a CDN, or a
    postinstall hook. {{unresolvedBuildSteps}} {{buildInstructions}}
  response: |-
    The build must not fetch or execute code or resources from a remote source. Every part of the build must come only from the dependencies declared in package.json/lock (resolved from npm or the committed lock file).

# Deterministic: a submitted source-code archive (--sca-root) was unnecessary because the shipped
# XPI IS the source - readable AND not generated. The pipeline asks both halves
# (resolveReviewMode): hasUnreviewableCode over xpiAddon.bundled answers whether the shipped
# bytes can be read, and the archive's source kinds answer whether they are the source, since a
# transpiler's output reads perfectly and is still generated. Only when both say the XPI stands
# on its own does it downgrade to a plain XPI review, setting ctx.scaNotRequired, which this
# check reports. A readable XPI whose build merely copies vendored libraries is caught here too -
# it downgrades before the build review runs. No `sca:` gate - it fires in the downgraded XPI
# review; silent in every other review.
- title: Source archive not required
  severity: warning
  check: sca-not-required
  input: source
  response: |-
    The shipped add-on (the built XPI) is directly reviewable, because its code is not minified, obfuscated or transpiled. A separate source-code archive is therefore not required, and this review was performed on the submitted XPI itself. A source-code submission is needed only when the shipped code is minified, transpiled or otherwise not human-readable, and it moves the add-on into a separate review process that takes considerably longer to complete. For this add-on you can avoid that delay by submitting only the XPI as a standard review.

# A vendored library the pre-step could not match to an npm package (src/vendor/
# verify.js auditGithub tries the repo-name candidate and proves it by content hash);
# surfaced as info so the reviewer knows it went unaudited. The source URL renders on the location line
# (as the finding's item), so the body needs no {{item}}/{{source}} slots.
- title: Vendored library not vulnerability-checked
  severity: info
  check: vendor-vuln-unknown
  input: source
  response: |-
    The add-on sourced a third-party file from a CDN, where its known-vulnerability status could not be determined automatically. To benefit from automated auditing against the OSV database, consider switching to an npm-hosted source and update your vendor mechanism to point to an unpkg or jsDelivr package (pinned to an exact version).
    Read more: https://webextension-api.thunderbird.net/en/mv3/guides/vendoring.html.

- title: Unpinned vendored source
  severity: error
  check: unpinned-vendor-source
  input: source
  response: |-
    The following vendored file(s) cite a source that is not pinned to an immutable version. Each is linked to a branch or unversioned URL rather than a specific release. Link to a specific version, tag, or commit so the file can be verified against the exact bytes it was copied from.

- title: Modified vendored library
  severity: error
  check: vendor-modified
  input: source
  response: |-
    A bundled third-party file does not match its declared source: {{item}} does not match the bytes its declared source ({{url}}) serves, so it appears to have been modified from the upstream release. Ship the file exactly as the source publishes it, or correct the declared source to the release the file actually came from.

- title: Missing vendored file
  severity: warning
  check: missing-vendor-file
  input: source
  response: |-
    One or more files listed in "{{item}}" are not present in the submission. Add each file to the submission, or remove its entry from "{{item}}".

# Flags a VENDOR file that exists but yields no parseable entry (no block pairs a
# More than one file in the package root names itself the VENDOR manifest, so which
# one the review reads would be decided by the archive's order rather than by the
# developer.
- title: More than one VENDOR file
  severity: error
  check: multiple-vendor-files
  input: source
  response: |-
    This add-on ships more than one file that names itself the VENDOR manifest. Which of them the review reads would depend on the order the archive lists them in, so the same submission could be checked against a different manifest after a rebuild. Keep the one that lists your bundled third-party libraries and remove the others.
    Read more: https://webextension-api.thunderbird.net/en/mv3/guides/vendoring.html.

# bundled library file with a source URL pointing to a file), so the declared
# libraries cannot be verified.
- title: Unparseable VENDOR file
  severity: error
  check: vendor-unparseable
  input: source
  response: |-
    A VENDOR file is present but no third-party library could be parsed from it. Declare each bundled library in its own block, separated from the next by a blank line. A block names the packaged file path and a source URL pointing at the exact file (on unpkg, jsDelivr, the npm registry, or a raw GitHub URL), so the file can be verified automatically. A bare repository link is not a source, and a path mentioned in a sentence is not a declaration. For example:

    lib/purify.min.js:
      source: https://unpkg.com/dompurify@3.2.7/dist/purify.min.js
      licence: Apache-2.0

    vendor/jszip.min.js:
      source: https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js
      licence: MIT

    A library may also be declared on a single line, and those need no blank line between them:

    lib/purify.min.js: https://unpkg.com/dompurify@3.2.7/dist/purify.min.js
    vendor/jszip.min.js: https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js

    Read more: https://webextension-api.thunderbird.net/en/mv3/guides/vendoring.html.

# Flags a single source URL declared as the source of more than one bundled file -
# a file source can verify only one file, so the pairing is ambiguous. A multi-file
# library must be declared as a directory with a single directory source.
- title: Ambiguous vendored source
  severity: error
  check: vendor-ambiguous-source
  input: source
  response: |-
    Each of the following source URLs is declared as the source of more than one bundled file. A file source can only verify one file, so the pairing is ambiguous. Give each file its own source URL, or - if they come from one place - declare the containing directory together with a single directory source URL.

# Flags data smuggled out through a channel not meant for it - always an error,
# regardless of consent. One check per channel (resource/stylesheet/window/
# navigation); all read the shared outbound-sink scan.
- title: Data smuggled through a resource URL
  severity: error
  check: disguised-resource
  input: source
  sweep-instruction: |-
    A resource loaded to be rendered or embedded, carrying data outward in its URL.
    Consent is no defence.
  response: |-
    This add-on appears to send data through a resource URL (image/iframe/media src) - a channel not meant for data transmission. Disguising transmission this way is not allowed, even with the user’s consent. Use a normal request and disclose what is sent.

- title: Data smuggled through a stylesheet
  severity: error
  check: disguised-stylesheet
  input: source
  sweep-instruction: |-
    A stylesheet, a CSS rule, or a property resolving to a remote reference, carrying
    data outward in its URL. Consent is no defence.
  response: |-
    This add-on appears to send data through a stylesheet or CSS url() - a channel not meant for data transmission. Disguising transmission this way is not allowed, even with the user’s consent. Use a normal request and disclose what is sent.

- title: Data smuggled through an opened window
  severity: error
  check: disguised-window
  input: source
  sweep-instruction: |-
    A new window or tab the add-on opens, carrying data outward in its URL. Consent is
    no defence.
  response: |-
    This add-on appears to send data through a window.open() to a remote URL - a channel not meant for data transmission. Disguising transmission this way is not allowed, even with the user’s consent. Use a normal request and disclose what is sent.

- title: Data smuggled through a navigation
  severity: error
  check: disguised-navigation
  input: source
  sweep-instruction: |-
    An already-open context sent elsewhere, carrying data outward in the URL. Consent
    is no defence.
  response: |-
    This add-on appears to send data through a page navigation - a channel not meant for data transmission. Disguising transmission this way is not allowed, even with the user’s consent. Use a normal request and disclose what is sent.

# Flags data transmitted to a remote host over an unencrypted (http/ws/ftp)
# connection - any cleartext transmission, whatever the payload.
- title: Unencrypted data transmission
  severity: error
  check: cleartext-transmission
  input: source
  sweep-instruction: |-
    A remote endpoint reached over http://, ws:// or ftp://. Whatever the payload:
    the objection is the transport.
  response: |-
    Data is sent over an unencrypted connection. All data must travel over an encrypted channel - use https:// (or wss:// for sockets), never http://, ws:// or ftp://.

# Preflight -> manual review: data sent to a hardcoded remote host means the
# listing must carry a privacy policy, which is not part of the package.
- title: Remote data transmission needs a privacy policy
  severity: hold-or-error
  check: privacy-policy
  escalation: manual-review
  input: source
  sweep-instruction: |-
    The add-on reaching a service the DEVELOPER chose - fixed in the add-on, not
    entered by the user - which receives anything about the user or their use of it.
  response: |-
    Please add a privacy policy to this add-on that details which user data is being sent and to what services. The critical things to describe in the policy are how your extension collects, uses, stores, shares or discloses information about people. If your add-on makes it apparent to websites that it is installed, this must also be mentioned. The policy should be about the extension only, not a copy of the website’s privacy policy. It should also be the actual text, as opposed to a link to a privacy policy on a website. The privacy policy can be added in the add-on settings under "Manage Authors & License" on addons.thunderbird.net. For more information, please check our Review Policies [1], and Mozilla’s own privacy policy [2] as an example.

    [1]: https://thunderbird.github.io/atn-review-policy/#data-disclosure-collection-and-management
    [2]: https://www.mozilla.org/en-US/privacy/
  instructions: |-
    This add-on transmits data to one or more hardcoded remote servers. Confirm
    the ATN listing carries a privacy policy that discloses what data is
    collected and why. The privacy policy must be pasted into the ATN field
    directly (links to remotely hosted policies are not allowed).

# Preflight -> manual review: the nativeMessaging permission lets the add-on talk
# to a native application. What the listing discloses about that exchange is not in
# the package, so a person settles it.
- title: Native messaging needs disclosure
  severity: hold-or-error
  check: native-messaging
  escalation: manual-review
  input: manifest
  response: |-
    This add-on requests the "nativeMessaging" permission to exchange messages with a native application outside Thunderbird. This must be disclosed on the ATN listing page, including what information is exchanged.
  instructions: |-
    This add-on requests the "nativeMessaging" permission. Confirm the add-on
    listing page on ATN discloses what information is exchanged with the local
    app and that it complies with the No Surprises policy.

# A packaged _locales directory requires a default_locale key, or Thunderbird
# will not load the add-on.
- title: Missing default_locale
  severity: error
  check: default-locale-missing
  input: xpi
  response: |-
    A _locales directory is present but the manifest declares no default_locale, so Thunderbird will refuse to load the add-on. Add a default_locale naming the fallback locale (e.g. "en").

# A default_locale key requires a packaged _locales directory, or Thunderbird
# will not load the add-on.
- title: Unused default_locale
  severity: error
  check: default-locale-unused
  input: xpi
  response: |-
    The manifest declares default_locale but the add-on ships no _locales directory, so Thunderbird will refuse to load the add-on. Add the _locales/<lang>/messages.json files, or remove default_locale.

# An extension with no top-level `icons` key ships no defined add-on icon, so
# Thunderbird shows the generic puzzle-piece placeholder in the Add-ons Manager.
# Advisory only (info); static themes and dictionaries are exempt (see the check).
- title: Add-on icon missing
  severity: info
  check: addon-icon-missing
  input: manifest
  response: |-
    Adding an add-on icon in manifest.json improves user acceptance.
    Read more: https://developer.thunderbird.net/add-ons/mailextensions/supported-manifest-keys#icons

# A background script using ES module syntax needs the background declared
# "type": "module", or it will not load.
- title: Background script needs type module
  severity: error
  check: background-module
  input: xpi
  response: |-
    The following background code location(s) use ES module syntax (import/export), but the manifest’s background is not declared "type": "module", so Thunderbird will fail to load the background script(s). Add "type": "module" to the background entry.

# A background PAGE (background.page HTML) whose <script src> loads module-syntax
# JS but is not declared type="module" - the page fails to load that script.
- title: Background page script needs type module
  severity: error
  check: background-page-module
  input: xpi
  response: |-
    The following background page code location(s) load a script that uses ES module syntax (import/export), but the <script> tag is not declared type="module", so Thunderbird will fail to load the background page. Add type="module" to the <script> tag.

# Dynamic code execution: the definite cases are deterministic (eval / Function
# constructor / code-string timers, and unsafe-eval/unsafe-inline in the CSP);
# the ambiguous fetch().then(eval) case is the remote-eval check below. All
# read the shared dynamic-execution scan. The eval/Function/timer/fetch-eval file
# scan only covers code OUTSIDE the pure WebExtension tree: a WebExtension sandbox
# cannot run these without a permissive CSP (the unsafe-eval/unsafe-inline checks
# report that), so only privileged Experiment / non-WebExtension code is scanned.
- title: eval() usage
  severity: error
  check: eval-call
  input: source
  response: |-
    Dynamic code execution via "eval()" is not allowed.

- title: Function constructor usage
  severity: error
  check: function-constructor
  input: source
  response: |-
    Dynamic code execution via "the Function constructor" is not allowed.

- title: Code-string timer
  severity: error
  check: string-timer
  input: source
  response: |-
    Dynamic code execution via "a code string passed to setTimeout/setInterval" is not allowed.

- title: CSP allows 'unsafe-eval'
  severity: error
  check: csp-unsafe-eval
  input: manifest
  response: |-
    Dynamic code execution via "content_security_policy 'unsafe-eval'" is not allowed.

- title: CSP allows 'unsafe-inline'
  severity: error
  check: csp-unsafe-inline
  input: manifest
  response: |-
    Dynamic code execution via "content_security_policy 'unsafe-inline'" is not allowed.


# Deterministic check: user-facing text hardcoded in a non-English language when
# the add-on ships no English _locales. franc detects the language over the HTML
# visible text and the manifest name/description (see the check). A confident
# non-English result is the finding. Too little or ambiguous text routes to
# manual review via `instructions`.
- title: Missing English localization
  severity: warning
  check: missing-english-localization
  escalation: code-review
  input: xpi
  instructions: |-
    This add-on ships no English localization, so user-facing text may be
    hardcoded in another language. Review its strings by hand and confirm if an
    English localization is provided.
  response: |-
    Please include an English localization. English serves as the default language in Thunderbird, and most users who do not understand the hardcoded language will most likely be able to read English. The i18n API allows defining strings for multiple locales, and Thunderbird automatically selects the one that best matches the user’s interface language.
    An example can be found here: https://github.com/thunderbird/webext-examples/tree/master/manifest_v2/i18n

# Flags shipped obfuscated JS that is not a recognized library; asks for the
# original sources. The structural detector families the verdict is drawn from are
# pinned (see src/lib/obfuscation.js), so a match is deterministic and needs no
# second opinion. The entry deliberately never names the detector or what it
# matched: the developer is told the file is obfuscated, not how it was recognized,
# which is not a hint worth handing to someone working around the check.
- title: Obfuscated code is not permitted
  severity: error
  check: obfuscated-code
  input: source
  response: |-
    The following file(s) are obfuscated. Extensions using obfuscated code are not permitted, regardless of whether they are hosted on addons.thunderbird.net (ATN) or not. Extensions using obfuscated code are in violation of our Add-on Policy and are subject to being blocked.
    Please read the instructions: https://extensionworkshop.com/documentation/publish/source-code-submission/

# Checks whose scan finds cases it cannot settle: those escalate to a person
# instead of becoming a finding, and the entry's `instructions` is what the
# reviewer is shown for each one.

# functions/events added after the declared strict_min_version. The
# deterministic pre-flight (strict-min-version-api.js) emits an UNGUARDED too-new
# call as a finding directly; a call carrying a guard signal (optional chaining, a
# typeof/existence check, an earlier guard clause, a getBrowserInfo version gate)
# escalates instead, for the reviewer to judge from the call's file whether the guard
# really keeps the call off the versions that lack the API. Only real, schema-resolved
# APIs reach here; a non-existent API is unknown-api's concern.
- title: API newer than strict_min_version
  severity: error
  check: strict-min-version-api
  escalation: code-review
  input: source
  instructions: |-
    Each call below is to an API that was introduced after the add-on's
    strict_min_version, so it throws on the versions in between. Check whether
    the call is guarded for those versions. This could be a feature detection, a
    cached flag, an early return, a try/catch or an explicit version gate, among
    others. Report it - asking for a higher strict_min_version - unless you can
    point at the guard.
  response: |-
    The add-on is setting strict_min_version to {{min}} but uses functions or events which were added later. Please adjust the value of strict_min_version accordingly.

# hidden/junk files and files reachable from no entry point; the
# ambiguous (dynamically-loadable) ones are escalated to a reviewer.
- title: Unused, hidden or duplicate files or folders
  severity: error
  check: unused-files
  escalation: code-review
  input: xpi
  instructions: |-
    The following files are reachable from no manifest entry point, so decide
    whether anything loads them at runtime. Two shapes reach here: a site that
    names the file literally, and a runtime loader that builds load paths at run
    time (a dynamic import, getURL, executeScript, insertCSS, setIcon and the
    like) and so may load it without naming it. If nothing loads them, they
    should not ship.
  response: |-
    The following file(s) or folder(s) appear to be unused or hidden. Such files complicate the review, may leak information about the system the XPI was built on, or needlessly increase the size of the add-on. Please correct your packaging process so they are not included.

# over-broad or unloaded web_accessible_resources exposure.
- title: Minimize web_accessible_resources
  severity: warning
  check: minimize-web-accessible-resources
  escalation: code-review
  input: xpi
  instructions: |-
    The following resources are exposed through web_accessible_resources and
    nothing in the add-on was found to load them. The key is needed only when
    something OUTSIDE the add-on reads the file: a content script (which runs in
    the web page's world), a real web page, or another extension. The add-on
    opening or embedding its own file from its own contexts - background, popup,
    sidebar, options, a tab page, or an iframe within one of its own pages -
    never needs it. Decide on that basis whether each exposure is required.
  response: |-
    One or more resources are registered as web_accessible_resources but may not need to be exposed. List files there only if a web page or content script must access them. Otherwise, remove these entries to reduce the add-on’s exposed surface.

# remote resources - <script>/<link>/<iframe>/media in HTML,
# @import/url() in CSS, import()/importScripts()/module imports, runtime <script>
# injection, remote WASM, and a CSP that permits a remote source. The definite
# remote loads are flagged deterministically; only the statically-undecidable
# sources are escalated.
- title: Remote resources
  severity: error
  check: remote-resources
  escalation: code-review
  input: source
  instructions: |-
    This site loads or injects a resource - script, style, frame or media - from
    a source static analysis could not resolve to a packaged file. Confirm by
    hand that it comes from a bundled file and not from a remote source.
  response: |-
    A resource is loaded from a remote source. Every resource - script, style, frame, and media - must be bundled with the add-on so it can be reviewed. Remote sources are not allowed.

# The same scan's other question (src/lib/remote-refs.js, shared with remote-resources
# above): a remote load inside a file whose CONTENT matched a published upstream release.
# The line is that release's, so it is not the developer's to defend - but nor does it
# follow that the add-on needs the file. Emits no findings of its own: every site goes to a
# person, who decides whether shipping it as published is acceptable, and a case settled
# against the add-on becomes an error like its sibling remote-resources. Turns on the content match,
# never on a declaration - an unverified declared file is reviewed as the developer's own
# code, so its remote loads stay remote-resources' findings.
- title: Remote load inside an upstream release
  severity: error
  check: vendored-remote-resources
  escalation: manual-review
  input: source
  instructions: |-
    Each of these remote loads is inside a file whose content matches a published
    file of the upstream release listed after it - so the line is that release's,
    not something the developer wrote. That does not by itself mean the add-on
    needs this file, or that no build of the library avoids the remote load.
    Decide whether shipping it as published is acceptable here.
  response: |-
    A bundled third-party file loads a resource from a remote source as published upstream. Every resource - script, style, frame, and media - must be bundled with the add-on so it can be reviewed. Please ship a build of the library that does not load anything remotely, or remove the dependency.

# the statically-undecidable fetch().then(eval) case - is the executed
# code remote? The definite eval/Function/timer/CSP cases are deterministic
# checks above. Like them, the shared scan only covers code OUTSIDE the pure
# WebExtension tree (WebExtension code is CSP-gated, see unsafe-eval/unsafe-inline).
- title: Remote eval
  severity: error
  check: remote-eval
  escalation: code-review
  input: source
  instructions: |-
    The following location(s) execute code assembled at run time, such as
    fetch().then(eval).
    Confirm by hand that the executed code is static and local, and that nothing
    remotely fetched is executed.
  response: |-
    Remotely fetched code is executed at the following location(s). Remote code execution is not allowed - bundle all code with the add-on so it can be reviewed.

# normal transmission (fetch and friends) to a remote host - allowed
# only with an options-page opt-in, judged from the options page in evidence.
- title: User-data exfiltration
  severity: error
  check: data-exfiltration
  escalation: code-review
  input: source
  instructions: |-
    The following code locations send data to a remote server. User data -
    message content, attachments, contacts, credentials - may be transmitted only
    if the user actively enabled it: by entering the destination URL or
    credentials on an options page that states what is sent, or through an
    explicit off-by-default opt-in for a hard-coded URL. Thunderbird has no
    built-in data-collection consent prompt, so there is no implicit consent to
    rely on. The add-on's own options page, if it has one, is where such an
    opt-in would live. Confirm for each location that consent of that kind
    exists.
  sweep-instruction: |-
    Message content and headers, attachments, contacts, credentials, or anything
    derived from them, reaching a remote host without the user asking.
  response: |-
    The following code location(s) send user data to a remote server without an explicit opt-in. User data may be transmitted only when the user actively enables it on an options page that discloses what is sent.

# the WEAK disguised-transmission residue - a covert channel (resource
# URL, stylesheet url(), window.open, or page navigation) built with a runtime
# value but no user-data API call. The strong case (a user-data call in the URL) is
# the deterministic disguised-* errors; this asks whether the dynamic URL is really
# an undisclosed data send or just legitimate dynamic URL building.
- title: Data smuggled through a channel not meant for it
  severity: error
  check: disguised-transmission
  escalation: code-review
  input: source
  instructions: |-
    The following code locations build a URL to a remote host from a runtime
    value on a channel not meant for data transmission - a resource src or href,
    a stylesheet url(), a window.open(), or a page navigation. Smuggling user
    data out this way is not allowed even with the user's consent. But building a
    remote URL from a runtime value is also very common in legitimate code
    (navigating to a host path, loading a CDN asset by name), so decide for each
    whether user data actually leaves through it.
  sweep-instruction: |-
    Any other mechanism that presents as loading, rendering, opening or navigating
    while carrying data outward in its URL. Consent is no defence.
  response: |-
    The following code location(s) appear to send data through a channel not meant for data transmission - a URL used for loading, styling, opening or navigating, with data riding in it. Disguising transmission this way is not allowed, even with the user’s consent. Use a normal request and disclose what is sent.

# The token vocabulary the unused-permission check scans for, one entry per
# permission group. Each entry may carry min_strict_version / max_strict_version (an
# INCLUSIVE bound on the add-on's strict_min_version, compared at the bound's own
# precision - so "153" covers the whole 153.* series; adjacent major bounds partition
# with no gap; an unset version is treated as oldest). No entry currently sets a
# bound; the tabs/activeTab version pivot instead lives in the `tabs.query`
# schema-annotation notes - before Thunderbird 154, filtering tabs.query by url/title
# needs "tabs" even for the add-on's own pages; at/after 154 it does not.
# An entry declares `tokens`: the code-level spellings (API property names, manifest
# keys, literal strings) of every usage that justifies the permission.
# unused-permission scans the add-on's live code (comments excluded) and manifest for
# them and records WHERE each occurs: a permission whose version-matched entries
# declare tokens and whose tokens ALL appear nowhere is deterministically unused - a
# warning finding. When a token DOES occur, the permission escalates with each
# occurrence named, so the reviewer reads concrete lines rather than answering a bare
# yes/no over the whole add-on. An entry WITHOUT tokens (unlimitedStorage: quota/OPFS
# use is not token-detectable) has no site to point at, so its permissions escalate
# with nothing to anchor on.
# Token matching is CASE-SENSITIVE and on WORD BOUNDARIES (\btoken\b) over each
# source's code atoms and the manifest serialized as JSON (key names and values,
# including the permissions array itself - a test enforces that no token matches
# its own entry's permission declaration, or the declaration would self-ground and
# the entry would be silently inert). A token must therefore be a whole
# identifier / key / string word: `folder` matches a bare `.folder` read but not
# `displayedFolder`, so EVERY justifying spelling the schema gates on the
# permission - including each camelCase gated PROPERTY name - is listed
# explicitly. A missed spelling turns a used permission into a false "unused"
# finding, while an extra spelling merely widens escalation, so list generously.
permission-prompts:
  - permissions: accountsRead
    # Every name the schema gates on accountsRead, listed explicitly: tokens match
    # on word boundaries, so a broad `folder` would NOT catch the camelCase
    # spellings (additionalFccFolder, displayedFolder, ...). Derived from the
    # schema's <permission>accountsRead</permission> property/parameter annotations.
    tokens:
      - folder
      - folderId
      - additionalFccFolder
      - additionalFccFolderId
      - displayedFolder
      - displayedFolderId
      - selectedFolder
      - selectedFolders
      - overrideDefaultFcc
      - overrideDefaultFccFolder
      - overrideDefaultFccFolderId
      - identityId
      - selectedAccount
  - permissions: management
    tokens:
      - extensionId
  - permissions: messagesRead
    # `attachments` covers the messagesRead-gated attachments property a menus
    # OnClickData/OnShowData reports.
    tokens:
      - relatedMessageId
      - onAfterSend
      - onAfterSave
      - selectedMessages
      - attachments
  - permissions: cookies
    tokens:
      - cookieStoreId
  - permissions: webRequestBlocking
    tokens:
      - blocking
    # The example event `onAfterSendHeaders` below is DELIBERATELY fictional (real ones are
    # onBeforeSendHeaders / onSendHeaders / onBeforeRequest / ...): it forces the reviewer to
    # match the PATTERN (a webRequest.on* addListener with "blocking" in an array arg) and
    # apply it to the real event in the code, not echo the example. Do NOT "correct" it.
  - permissions: unlimitedStorage
  # The Thunderbird-154 own-page exemption is version-dependent. It is recorded as two
  # bounded `note` annotations on tabs.query (assets/schema-annotations/tabs.json), which
  # nothing reads today - the tokens below hold for both sides of the boundary.
  - permissions: tabs, activeTab
    tokens:
      - query
      - url
      - title
      - favIconUrl
      - overrideContext
      - onUpdated
  - permissions: activeTab
    # Namespace-qualified (dotted) tokens: matched against the resolved api-usage
    # (tabs.executeScript vs scripting.executeScript), not a bare `executeScript` word -
    # so only real injection CALLS count, never a stray identifier.
    tokens:
      - tabs.executeScript
      - tabs.insertCSS
      - scripting.executeScript
      - scripting.insertCSS
  - permissions: compose
    # The injection tokens are namespace-qualified (dotted): resolved against the
    # api-usage analysis, so only real tabs.*/scripting.* calls count. `attachments` is a
    # bare property token (a menus OnClickData/OnShowData read). The compose_scripts
    # manifest key is NOT a token here: it grounds compose deterministically (its
    # required_permissions annotation), so it is never escalated.
    tokens:
      - tabs.executeScript
      - tabs.insertCSS
      - scripting.executeScript
      - scripting.insertCSS
      - attachments
  - permissions: messagesModify
    # Namespace-qualified (dotted) injection tokens, resolved against the api-usage
    # analysis. message_display_scripts is NOT a token here: it grounds messagesModify
    # deterministically (its required_permissions annotation), so it is never escalated.
    tokens:
      - tabs.executeScript
      - tabs.insertCSS
      - scripting.executeScript
      - scripting.insertCSS
  # No "scripting" entry: unlike compose/messagesModify (which need the semantic judgment
  # of WHICH kind of tab the injection targets), "scripting" is guarded at the namespace
  # level (the scripting schema namespace declares permissions: ["scripting"]), so ANY
  # scripting.* call grounds it deterministically in analyzePermissions - there is no
  # ambiguous case to escalate. It is also grounded by the message_display_scripts
  # manifest key (before Thunderbird 154). A declared-but-unused scripting therefore has
  # no entry here and escalates, like any other permission the tokens cannot settle.


manual-checks:
# Manual: the content the add-on SHIPS. Everything here is inside the submitted
# package, so every fix needs a new version - which is what separates it from
# unacceptable-listing-content.
- title: Check the package for unacceptable content
  check: unacceptable-package-content
  severity: error
  instructions: |-
    Inspect what the add-on ships: its name and description in manifest.json, its
    icons, and any text, images or media bundled in the package. Determine whether
    any of it is spam, inappropriate, misleading, or low-effort, or breaches
    Mozilla's Acceptable Use Policy
    (https://www.mozilla.org/about/legal/acceptable-use/). Only content inside the
    submitted package belongs here. The ATN listing is a separate check.
  response: |-
    Content shipped inside this add-on does not meet our content requirements. It must not be spam, inappropriate, misleading, or low-effort, and it must comply with Mozilla's Acceptable Use Policy (https://www.mozilla.org/about/legal/acceptable-use/). Please correct the affected content and submit a new version.

# Manual: exercise the add-on in a test profile; may need credentials or info.
- title: Test the add-on and request testing information if needed
  check: test-add-on
  severity: hold-or-error
  instructions: |-
    Test the add-on’s functionality in a test profile, and check if it needs
    additional information like credentials in order to continue the review.
  response: |-
    Please provide us with detailed information on how to test this add-on. If authentication to a website is necessary, give us a test username and password to facilitate our work. This can be provided in the Whiteboard field, which can be found in the Edit Listing page under the Technical Details section. This information is only available to reviewers.

# Manual: behavior not documented on the ATN listing (inspect the version diff).
- title: Check for "No Surprises" policy violations
  check: no-surprises-policy
  severity: error
  instructions: |-
    Test the add-on’s functionality in a test profile and inspect the code for
    any unexpected features or behavior that is not documented on the ATN
    listing page and could be a surprise to the user. A diff against the last
    accepted version may be helpful.
  response: |-
    Your add-on includes a feature that is not related to its primary function and is not mentioned in the description of your add-on listing page on ATN (addons.thunderbird.net). This feature must be strictly opt-in: <name of feature>.

# Manual: payment is required but the ATN "needs payment" flag is off.
- title: Check for a missing payment disclosure
  check: missing-payment-disclosure
  severity: hold-or-error
  instructions: |-
    Test the add-on’s functionality in a test profile. Verify whether the
    add-on requires a subscription or other form of payment to function but the
    "needs payment" flag on the add-on’s ATN listing page is not enabled.
  response: |-
    It looks like a payment is required to use this add-on or the service this add-on relies on, either upfront, after a trial period or in conjunction with a paid software. If so, we need to ask you to update the payment status to yes.

# Manual: limited/non-public audience (better self-hosted than publicly listed).
- title: Check suitability for listing
  check: suitability-for-listing
  severity: error
  instructions: |-
    Judge whether the add-on targets a limited or non-public audience (for
    example an internal, single-organization, or test-only add-on) and should
    better self-hosted than publicly listed on ATN.
  response: |-
    Due to its limited or non-public audience, this add-on is not suitable for listing on ATN (addons.thunderbird.net). Please consider self-hosting and distributing it yourself.

# Manual: the content on the ATN LISTING. Nothing here is in the package, so every
# fix is an edit on addons.thunderbird.net and no new version is needed.
- title: Check the listing for unacceptable content
  check: unacceptable-listing-content
  severity: hold-or-error
  instructions: |-
    Inspect the add-on listing page on ATN: its summary, description and
    screenshots. Determine whether any of it is spam, inappropriate, or
    misleading, or breaches Mozilla's Acceptable Use Policy
    (https://www.mozilla.org/about/legal/acceptable-use/). The description here is
    the one on the listing page, not the one in manifest.json. Only the listing
    belongs here. What the package itself ships is a separate check.
  response: |-
    The add-on listing page on ATN (addons.thunderbird.net) does not meet our content requirements. Its summary, description and screenshots must not be spam, inappropriate, or misleading, and they must comply with Mozilla's Acceptable Use Policy (https://www.mozilla.org/about/legal/acceptable-use/). Please update the listing. A new version of the add-on is not needed.

# Manual: icon imitating the Thunderbird/Mozilla logo (an image checks can’t see).
- title: Check the icon for trademark or logo imitation
  check: icon-trademark-imitation
  severity: error
  instructions: |-
    Inspect the add-on’s icon, if it imitates or incorporates the Thunderbird or
    Mozilla logo.
  response: |-
    This add-on’s icon imitates or incorporates a Mozilla trademark (the Thunderbird or Mozilla logo), which is not allowed under Mozilla’s Trademark Policy (https://www.mozilla.org/foundation/trademarks/policy/). Please use a distinct icon.

# Manual: the ATN listing page lacks usage details/entry points or screenshots.
- title: Missing ATN description or details
  check: missing-atn-description
  severity: hold-or-error
  instructions: |-
    Verify that the add-on listing page on ATN includes detailed instructions on
    how to use the add-on and where to find its entry points. It should also
    include screenshots to help users quickly understand how the add-on works.
  response: |-
    The add-on listing page on ATN (addons.thunderbird.net) should include detailed instructions on how to use the add-on and where to find its entry points. Please also include screenshots to help users quickly understand how the add-on works.

# Manual: the ATN listing page should have an English version.
- title: Missing English ATN localization
  check: missing-english-atn-localization
  severity: hold-or-error
  instructions: |-
    Verify that the ATN listing page also has an English version.
  response: |-
    The add-on listing page on ATN (addons.thunderbird.net) should also have an English localization. English serves as the default language in Thunderbird, and most users who do not understand the available non-English version will most likely be able to read English.

# Manual: is this a fork of an existing add-on that must be distinguished from the
# original?
- title: Forked add-on
  check: forked-add-on
  severity: error
  instructions: |-
    Check if the submission is a fork of an existing add-on. Such forks are only
    allowed on ATN if they are clearly distinguished from the original and
    provide a significant difference in functionality and/or code. Exceptions may
    be made where the add-on is no longer maintained by its original author. The
    primary goal, however, should be to connect the two developers and let the
    new developer help maintain or take over the existing add-on. In general,
    small-change forks of still-active projects cause confusion for users and
    unnecessary overlap for developers. We encourage developers to contribute
    their improvements directly to the original project.
  response: |-
    The submission appears to be a fork of an existing add-on that is still being actively maintained. According to our review policies (https://thunderbird.github.io/atn-review-policy/):

    "If the add-on is a fork of another add-on, the name must clearly distinguish it from the original and provide a significant difference in functionality and/or code. Exceptions may be made in instances where the add-on is no longer maintained by the original author."

    Because the original project is still active, your submission does not meet these requirements. Small-change forks can sometimes cause confusion for users and unnecessary overlap for developers. We encourage you to consider contributing your improvements directly to the original project so that all existing users can benefit from your ideas.

# Headings shown above each severity group in the report’s Found Issues section
# (numbering is continuous across the groups).
issue-headings:
  error: "The following findings caused the submission to be rejected:"
  hold: "To continue the review, a few issues still need to be addressed:"
  warning: "We kindly ask you to resolve the following issues with your next release:"
  info: "We would like to share the following information with you:"


# System notices the orchestrator emits (not tied to one check): "{{item}}" is
# filled with the relevant check id / token. Keeps every printed string here.
messages:
  check-failed: |-
    The "{{item}}" check could not be run. The other checks still ran.

# The customer-facing preamble at the top of the report’s Found Issues section:
# "none" when there are no findings, "rejected" when there is any error finding,
# "hold" when there is none but the review cannot proceed (a hold finding), and
# "feedback" otherwise (warnings/info only). With findings, it is glued to the
# first severity heading; with none, it is the whole Issues body.
verdict-intros:
  none: "The automated review did not find any issues."
  feedback: "Thank you for your contribution, it will be approved shortly."
  hold: "Thank you for your contribution."
  rejected: "Thank you for your submission. We appreciate the effort you’ve put into creating this add-on. However, it cannot be accepted and hosted on addons.thunderbird.net in its current form."

# The verification prompt --llm-review prints, directly above the Review Details section
# that names the item file it works from. It is the whole output of such a run: the report
# itself is not printed, so this text and that file are all its reader gets.
#
# Three parts, in the order a reader needs them: `intro` says what the job is and where
# the review IS, each ask is an INVENTORY line naming one section of it, and `outcome` is
# the PROCEDURE - numbered steps, because a model follows a numbered list far more
# reliably than prose, and every rule sits on the step it governs instead of being
# collected at the end.
#
# `intro` always, `issues` only when the Found Issues section carries a finding,
# `code-review` only when the "Extended Code Review" section carries an item, and the two
# manual ones only when their own section does - a prompt must not ask for work the report
# does not contain, and must not leave out work it does. `outcome` closes the prompt
# whenever any ask printed: with nothing to settle there is nothing to hand back.
# Printed text, so the wording lives here like all the rest.
# The sweep framing, authored twice - once for each reader.
#
# Both carry the one rule that decides a sweep - judge by effect, not by method - because
# a reviewer sweeping by hand and an agent sweeping under --llm-review are doing the same
# reading. They part twice. The agent is told what to hand back, since a reviewer writing
# a review produces no such thing. And the agent is told to resolve runtime values and
# follow them through helpers and libraries, which a reviewer does not need spelled out.
#
# Authored twice rather than shared-plus-addendum, so each reads as one text to its own
# reader. The cost is that the shared rule lives in two places: change it in one and
# change it in the other, or the reviewer and the agent are told different things.
sweep-intro-human: |-
  Review the add-on for each of the things listed below. Judge by EFFECT, never by the
  METHOD used - an unfamiliar form counts as much as a familiar one.

sweep-intro-llm: |-
  Read the add-on for each of the things listed below. Judge by EFFECT, never by the
  METHOD used - an unfamiliar form counts as much as a familiar one. Resolve values
  assembled or supplied at runtime, and follow them through helpers and bundled
  libraries.

  Hand back one line per thing you find: the check it answers, the file, the line, and a
  short phrase naming what is there. Nothing else - no verdict, and no wording for the
  developer; that is the linter's.

llm-review-prompt:
  intro: |-
    Please verify this review and settle its manual items with the reviewer. Every item of it is in the JSON array named under "Review Details" below, one entry per item, in report order, each carrying its own "index" and the report section it is listed under.
  issues: |-
    The "Found Issues" entries are what the deterministic checks proved. Judge only whether
    each one is right, never whether it matters.
  code-review: |-
    The "Extended Code Review" entries are cases a deterministic check could not settle, so
    it marked them unsure and left them for inspection. They are settled by reading the
    add-on, which is your job here, not the reviewer's. The linter keeps the WebExtension
    schema files in its schema cache, so read them there for the permissions and methods
    this manifest version has.
  extended-manual-review: |-
    The "Extended Manual Review" entries are cases a check could not settle from the package
    at all. Only the reviewer can answer them.
  standard-manual-review: |-
    The "Standard Manual Review" entries are the checks done by hand on every submission.
    They need the ATN listing page, the add-on exercised in a test profile, or a judgement
    only a person can make.
  pre-sweep: |-
    The "Standard Code Review" entry is not a finding and settles nothing. It is ONE
    sweep, carried by every submission: a shared method, then the bare class of code each
    check cannot detect for itself. What a sweep finds is a finding OF THE NAMED CHECK.
  outcome: |-
    Work in this order:

    1. Run the sweep first. Spawn ONE independent sub-agent - a single agent, and never the one that goes on to verify this review, so that no finding is checked by whoever produced it. Give it ONE request: the "Standard Code Review" entry's "intro", then its whole "items" list. It returns plain "check - file:line - hint" lines, and no verdict, no response text and no prose beyond that hint. The linter spawns nothing; you do. WAIT for both agents, and while they work do NOTHING ELSE - do not open the add-on, do not start verifying, and do not describe the add-on yourself, which is the second agent's job and a pass the review would pay for twice. The one thing worth doing is locating the linter's schema cache, which you need later and which says nothing about this submission.

    2. Give the reviewer the add-on description now, before you verify anything, so they can read it while you work through the next two steps. Have the agent write it as a Markdown file beside the item file named under "Review Details", as <that file's name>.summary.md, and open it for them. Print its path on a line of its own as well, so they can reopen it and in case opening failed. Anything quoted from the add-on - its name, its description, a string it ships - goes in a code span, so they see it as the add-on wrote it rather than as markup.

    3. Verify every finding in ONE pass - the ones the linter made and the ones the sweep returned, together. A linter finding that is not correct is "withdrawn"; a swept candidate that does not hold is simply never written down, and each that does becomes an entry in this file's "additions", carrying the "check" it was found for. Judge them against each other, not one at a time: the items a sweep answers are independent questions, so ONE location can hold under two of them and is then two findings - never drop one because another already names that line. But a candidate naming a transmission a finding already reports is one transmission reported twice, and only one belongs in the review. An addition carries only what a sweep returned: if verifying turns up something no agent reported, it is not yours to file - a finding checked by whoever produced it has not been checked. Never put any of this to the reviewer.

    4. Settle each "Extended Code Review" entry yourself, following that entry's "instructions". A case that holds against the add-on is "reported", one that does not is "cleared".

    5. Put every manual review entry ("Extended Manual Review" and/or "Standard Manual Review") to the reviewer in index order, batched: ask as many at once as your question tool allows in a single call, and wait for each batch to be answered before asking the next. Ask each entry's "instructions" as its question, with that entry's "title" as the question's first line followed by a blank line. Label the question with its position among these entries and their total (for example "3/11"). Offer exactly two answers, ALWAYS in this order: "Report" first, "Clear" second - never reordered, not even to put a likelier answer first, because a reviewer working through a batch answers by position. "Report" means the case holds against the add-on and the developer is told, "Clear" means there is nothing to tell them.

    6. Write a SEPARATE JSON file naming the reviewed add-on, holding the settled entries keyed by their "index" and the sweep results in "additions". Leave the item file itself untouched. The "addon" is the path printed under "Review Details" as the reviewed XPI, and it is checked: an index means nothing without it, so nothing in this file can be applied to another submission by accident.

    {"addon": "/path/to/the-reviewed.xpi",
    "additions": [{"check": "data-exfiltration", "file": "background/background.js", "line": 40, "hint": "<a ping> attribute posts the message digest"}],
    "verdicts": {"3": "reported", "4": "cleared", "7": "withdrawn"}}

    An addition carries no "index" and no verdict. An index belongs to the linter's numbering of the document it wrote, and an addition was never in it; it is addressed by its "check" and its location instead. The linter files it under that check's own ruleId, band and wording, so it reads as a finding of that check rather than as a note from you. The "hint" is the one thing you write that a developer may read, so keep it to what is at that location - never a judgement, never a sentence of response.

    7. Report your own decisions in two sections: under "Found Issues", each finding you withdrew and why, and each finding a sweep added and where you found it; under "Extended Code Review", the verdict you reached for each entry and why. The reviewer's own answers need no report.

    8. Run the same webext-linter command again with --llm-verdict <your file> in place of --llm-review, and print the report it produces as a code block, unchanged. Write no report wording of your own, it is the linter's.
