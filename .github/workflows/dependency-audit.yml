# Daily check of the locked dependencies against the npm advisory database. A failed
# run is the alert: GitHub notifies whoever last changed the schedule below.
name: Dependency audit

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # Reads package-lock.json only, so nothing is installed.
      - run: npm audit

  # GitHub disables a schedule after 60 days without repository activity. Re-enabling the
  # workflow on every run resets that clock, so the audit keeps running on a quiet repo.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/dependency-audit.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
